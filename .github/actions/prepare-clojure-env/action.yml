name: 'Prepare clojure env'
description: 'Prepare clojure enviroment for build'
runs:
  using: "composite"
  steps:
    - name: Cache local Maven repository
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/project.clj') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up JDK 11
      uses: actions/setup-java@215b7e5f829ab9cac114c149667e57dc1b70b4bc # v2
      with:
        java-version: '11'
        distribution: 'temurin'

    - uses: szenius/set-timezone@dd47655c84241eec2ffa0a855959c16c0920c3c4 # v1.0
      with:
        timezoneLinux: "Europe/Helsinki"

    - name: Install clojure tools
      uses: DeLaGuardo/setup-clojure@94d767dbb80ae5c637d0f1ad70b75fa2b00495cd # 13.0
      with:
        lein: 2.9.1
